[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-trade-intraday"
version = "0.2.1"
description = "Research-only hybrid QUBO intraday portfolio optimizer for US equities and ETFs"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "scipy>=1.12", "requests>=2.31",
    "exchange-calendars>=4.5", "matplotlib>=3.8", "pyarrow>=15", "qiskit==2.5.2", "qiskit-aer==0.17.2",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
qc-trade = "qc_trade.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qc_trade*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
